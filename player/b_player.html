<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> Bplayer Live </title>
    <meta name="referrer" content="no-referrer" />

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #000;
            overflow: hidden;
            /* Prevents accidental scrollbars */
        }

        #video-container {
            width: 100vw;
            /* Fills 100% of viewport width */
            height: 100vh;
            /* Fills 100% of viewport height */
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            background: #000;
            object-fit: contain;
            /* Keeps aspect ratio. Change to 'cover' if you want zero black bars */
        }

        #watermark {
            position: absolute;
            bottom: 20px;
            /* Adjusted for better spacing on full screens */
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 14px;
            /* Slightly larger for big screens */
            background-color: rgba(0, 0, 0, 0.6);
            padding: 4px 10px;
            border-radius: 4px;
            font-family: Arial, sans-serif;
            pointer-events: none;
            user-select: none;
            z-index: 10;
            /* Ensures it stays on top of the video */
        }

        #fullscreen-button {
            position: absolute;
            top: 20px;
            /* Adjusted spacing */
            left: 20px;
            color: white;
            background-color: rgba(0, 0, 0, 0.7);
            border: none;
            padding: 10px 16px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            font-family: Arial, sans-serif;
            z-index: 10;
            /* Ensures it stays on top of the video */
        }

        #fullscreen-button:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }

        #error-message {
            display: none;
            color: white;
            font-size: 18px;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            font-family: Arial, sans-serif;
            margin: 0 16px;
            z-index: 10;
        }
    </style>
</head>

<body>
    <div id="video-container">
        <video id="video" controls autoplay playsinline></video>
        <div id="error-message">
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
    const url = params.get('url');

    const video = document.getElementById('video');
    const errorMessage = document.getElementById('error-message');
    const watermark = document.getElementById('watermark');
    const fullscreenButton = document.getElementById('fullscreen-button');

    function showError() {
      errorMessage.style.display = 'block';
      video.style.display = 'none';
      watermark.style.display = 'none';
      fullscreenButton.style.display = 'none';
    }

    function normalizeUrl(u) {
      try {
        return decodeURIComponent(u);
      } catch (_) {
        return u;
      }
    }

    if (!url) {
      showError();
    } else {
      const streamUrl = normalizeUrl(url);

      if (Hls.isSupported()) {
        const hls = new Hls({
          fetchSetup: (context, initParams) => {
            initParams.referrerPolicy = 'no-referrer';
            return new Request(context.url, initParams);
          },
        });

        hls.loadSource(streamUrl);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {});
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data && data.fatal) showError();
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;

        video.addEventListener('loadedmetadata', () => {
          video.play().catch(() => {});
        });

        video.addEventListener('error', () => {
          showError();
        });
      } else {
        showError();
      }
    }

    fullscreenButton.addEventListener('click', () => {
      if (video.requestFullscreen) {
        video.requestFullscreen();
      } else if (video.webkitEnterFullscreen) {
        video.webkitEnterFullscreen(); 
      } else if (video.msRequestFullscreen) {
        video.msRequestFullscreen();
      }
    });
    </script>
</body>

</html>
